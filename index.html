<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roleta de Estudos — CMDB & CSDM</title>
<style>
:root{--bg:#0b1026;--card:#fff;--ink:#182033;--accent:#6c5ce7;--gold:#ffd166;--green:#00b894}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 20% 10%,#303b7a,#171d42 38%,#0b1026 78%)}
.container{max-width:1180px;margin:auto;padding:26px 18px 50px}h1{text-align:center;font-size:34px;margin:0}.subtitle{text-align:center;color:#cbd2ee;margin:7px 0 24px}
.layout{display:grid;grid-template-columns:520px 1fr;gap:24px}.panel{background:#ffffff12;border:1px solid #ffffff26;border-radius:22px;padding:22px;box-shadow:0 15px 50px #0005}
.wheel-wrap{display:flex;justify-content:center;position:relative;padding:10px 0 16px}canvas{width:470px;height:470px;max-width:100%;filter:drop-shadow(0 16px 20px #0006)}
.pointer{position:absolute;top:3px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:32px solid var(--gold);z-index:3}
button{border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer}.spin{display:block;width:100%;background:linear-gradient(90deg,#ff8a00,#ff3d81,#6c5ce7);color:#fff}.spin:disabled{opacity:.5}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.secondary{background:#eef1ff;color:#27315c}.counter{text-align:center;margin-top:10px;color:#cbd2ee;font-size:13px}
.result{background:#fff;color:var(--ink);border-radius:22px;padding:25px;min-height:500px}.result.empty{display:flex;align-items:center;justify-content:center;text-align:center;color:#7a8295}
.number{display:inline-flex;width:44px;height:44px;border-radius:50%;align-items:center;justify-content:center;background:linear-gradient(135deg,#6c5ce7,#00b894);color:#fff;font-weight:900;font-size:20px}.topic{margin-left:8px;color:#6c5ce7;font-weight:800}
.question{font-size:21px;line-height:1.5;margin:20px 0;white-space:pre-line}.answer{background:#effbf6;border-left:6px solid #00b894;border-radius:12px;padding:17px 18px;font-size:17px;line-height:1.55;white-space:pre-line}.answer-title{font-weight:900;color:#087f5b;margin-bottom:7px}
.tip{margin-top:15px;background:#fff7df;border-left:5px solid #ffd166;padding:13px;border-radius:10px;color:#634f10}.history{margin-top:18px}.history h3{margin:0 0 10px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#27315c;color:#fff;padding:7px 10px;border-radius:999px;font-size:12px}
@media(max-width:900px){.layout{grid-template-columns:1fr}canvas{width:430px;height:430px}}@media(max-width:520px){h1{font-size:27px}canvas{width:340px;height:340px}.result{min-height:auto}}
</style>
</head>
<body>
<div class="container">
<h1>🎡 Roleta de Estudos — CMDB & CSDM</h1>
<div class="subtitle">Gire a roleta e deixe a sorte escolher qual questão você vai revisar.</div>
<div class="layout">
<section class="panel">
<div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="700" height="700"></canvas></div>
<button id="spin" class="spin" onclick="spin()">🎯 GIRAR A ROLETA!</button>
<div class="controls"><button class="secondary" onclick="resetWheel()">🔄 Nova rodada</button><button class="secondary" onclick="randomDirect()">🎲 Escolher sem girar</button></div>
<div class="counter" id="counter"></div>
<div class="history"><h3>Últimos números</h3><div class="chips" id="history"></div></div>
</section>
<section id="result" class="result empty"><div><div style="font-size:55px">🎓</div><h2>Pronto para estudar?</h2><p>Clique em <b>GIRAR A ROLETA!</b>.<br>Quando ela parar, a pergunta e a resposta aparecerão aqui.</p></div></section>
</div></div>

<script>
const DATA=[{"q": "Which key stakeholders from the organization should be involved in\ndecisions regarding population of the CMDB using the CSDM Crawl Stage?", "a": "Business Service Manager, Technology Service Owner"}, {"q": "A CMDB Manager wants to start adding CSDM design and planning (design)\ndomain components into the CMDB.\n\nWho is involved in this exercise?", "a": "Application Owner (sua resposta)\nEnterprise Architect"}, {"q": "A Configuration Manager needs to ensure each device in the CMDB has a unique serial number to avoid the risk of creating duplicate CIs.\n\nWhich management tool is used to identify CIs without serial numbers?", "a": "CMDB Data Foundations Dashboard"}, {"q": "A CMDB Administrator is reviewing the health of the CMDB and notices a\nlarge percentage of the Hardware CIs are missing serial numbers. The\nAdministrator is concerned this may cause duplicate CIs and would like\nto resolve the issue in a timely manner.\n\nWhat structured guidelines provided by ServiceNow are available to\ntroubleshoot and resolve the issue?", "a": "CMDB Health Dashboard Playbooks"}, {"q": "A CMDB Administrator is leveraging CI data as part of an Integrated Risk Management implementation and the Entity Scoping process. The Administrator wants to leverage the CSDM Data Foundations Dashboard playbooks under the Run tab.\n\nWhich CSDM relationships are leveraged using the CSDM playbooks?", "a": "Logical CIs that have relationships with Information Objects\nBusiness Applications that have their relationships to Information Objects"}, {"q": "CMDB class owners are receiving tasks under the 'My Work' tab in the\nCMDB Workspace.\n\nWhich CMDB management tool is generating these tasks?", "a": "CMDB Data Manager"}, {"q": "A CMDB Manager is in the crawl stage of their CMDB journey and would like to follow the Common Service Data Model.\n\nWhat domains would be addressed?", "a": "Design\nManage Technical Services"}, {"q": "A ServiceNow Process Owner wants to drive business decisions by using the Business Application records in ServiceNow.\n\nHow would the Process Owner use this?", "a": "Application rationalization"}, {"q": "A CMDB Administrator aims to utilize CSDM life cycle field mappings to\nbetter align with CSDM best practices.\n\nWhat is the next step to take after selecting the Enable Life Cycle Sync\nbutton?", "a": "Resolve any incomplete field mappings identified in the Discrepancy Report"}, {"q": "The Incident Process Owner asks which classes of CSDM are used on the\nIncident form.\n\nWhich classes are appropriate?", "a": "Service Offering (sua resposta)\nApplication Service"}, {"q": "A CMDB Administrator has built a number of Technology Management Service\nOfferings (Technical Service Offerings) based on Dynamic CI Groups to\nbetter maintain group alignment for the member CI.\n\nWhich Groups are synced to CIs from the offering that has a relationship\nto a Dynamic CI Group?", "a": "Support Group (sua resposta)\nOwned by Group"}, {"q": "A Service Portfolio Manager wants to know what Application Services\ntheir Business Service Offerings depend on.\n\nWhat stage of CSDM would map this relationship?", "a": "Walk"}, {"q": "Where can a CMDB 360/Multisource CMDB Saved Query be viewed and created\nin the CMDB Workspace?", "a": "Saved queries window on the CMDB 360 tab"}, {"q": "An Enterprise Architect of a financial services company is working\nacross the enterprise and wants to track their capabilities.\n\nWhich CSDM 5 domain is used?", "a": "Design and Planning (Design)"}, {"q": "A CMDB Administrator is asked to clean up the CMDB duplicates.\n\nWhat is the preferred way to manage this task?", "a": "The de-duplication dashboard on the CMDB workspace"}, {"q": "The CMDB Administrator group aims to display meaningful results on the\nCMDB Health Dashboard Compliance Scorecard for server records that are\nnot on the latest patch.\n\nWhat must be configured to achieve this goal?", "a": "Certification Policies, Data Filters, Scheduled Jobs"}, {"q": "The CSDM object \"Application Service\" correspont to witch domain?", "a": "Service Delivery domain"}, {"q": "The CSDM \"Business Service\" correspont to witch domain?", "a": "Sell / Consume domain"}, {"q": "The CSDM object \"Business Process\" correspont to witch domain?", "a": "Foundation domain"}, {"q": "The CSDM object \"Business Application\" correspont to witch domain?", "a": "Design and Planning domain"}, {"q": "Which is a purpose or requirement of CMDB Data Manager in ServiceNow?", "a": "Automates the enforcement of relationship rules between CIs in the CMDB"}, {"q": "The CMDB Administrator wants to leverage the Staleness metric from the\nCMDB Health Dashboard - Correctness Scorecard.\n\nWhich field is used to calculate the duration of this metric?", "a": "Most recent discovery (last_discovery)"}, {"q": "A CMDB Administrator wants to take full advantage of the CMDB 360/Multisource CMDB feature.\n\nHow does the feature help?", "a": "Allows defining reconciliation rules between discovery sources changing values\nAllows the CMDB to recompute after a reconciliation rule change, without waiting for a new data load"}, {"q": "A CMDB Administrator knows that the CMDB Data Foundation Dashboard is a\nresource to monitor and improve data quality.\n\nWhat is a benefit of this dashboard?", "a": "Provides key health-related metrics to make decisions"}, {"q": "Which roles are assigned to a user to either configure or work on tasks generated by CMDB Data Manager?", "a": "cmdb_dm_user\ncmdb_dm_admin"}, {"q": "What is the value of using the CMDB in security operations?", "a": "Allows security team to assess and remediate an incident \nIdentifies the IT infrastructure with a vulnerability"}, {"q": "A CMDB Manager is in the crawl stage of their CMDB journey and would like to follow the Common Service Data Model.\n\nWhat domains would be addressed?", "a": "Design \nManage Technical Services"}, {"q": "How does a CMDB Administrator use the ServiceNow Platform to ensure the\ndata quality associated with CIs in the CMDB?", "a": "Data Quality Scheduled Job"}, {"q": "The ITSM Manager wants to use Technology Management Offerings (Technical\nService Offerings) to populate the support group of associated CIs.\n\nWhat CSDM stage would this be completed in?", "a": "Run"}, {"q": "The Application Portfolio Management team is asking for help modeling platforms as Business Applications.\n\nHow would this be mapped in CSDM using the ServiceNow Platform in the Incident and Change applications?", "a": "ServiceNow Platform would be an Architecture type of Platform Host. Incident and Change would be Platform Applications and have a reference to ServiceNow Platform"}, {"q": "The Configuration Management team finds value in the reports from CMDB\n360/Multisource CMDB and wants to use it for all CI data.\n\nWhich must be true in order for CMDB 360/Multisource CMDB to be able to\nreport on and analyze that data?", "a": "The CI data must go through the IRE."}, {"q": "A CMDB Administrator is evaluating whether to monitor the metrics\nprovided on the CMDB Data Foundation Dashboard.\n\nWhich benefits support the decision to continually monitor the results\non this dashboard?", "a": "Provides metrics for CIs Processed by the IRE\nProvides metrics on active CIs updated in the last 90 days"}, {"q": "life_cycle_object", "a": "This table uses the type of CI (hardware, document, logical, etc.) to determine which sub-level life cycle state values are available."}, {"q": "life_cycle_stage", "a": "This is a record attribute that reflects a meta-level state of the record life cycle."}, {"q": "The IRE has identified duplicates for one CI.\n\nWhich will be updated by the IRE?", "a": "The oldest CI determined by the creation date"}, {"q": "A CMDB Administrator is beginning the journey of populating the CMDB and\nneeds to verify that any data which is no longer useful/applicable is\nremoved.\n\nWhich governance management tool will accomplish this?", "a": "CMDB Data Manager"}, {"q": "A CMDB Administrator wants to leverage the CMDB Data Foundations\nDashboard.\n\nWhat are benefits of using this application?", "a": "Checks that important data is valid and properly configured \nUses automation to remediate potential risks"}, {"q": "Which ServiceNow modules can be leveraged to configure recommended\nfields and generate task records in cases where these fields are missing\nfor Linux servers in the CMDB?", "a": "CI Class Manager and Health Preferences"}];
const N=DATA.length;
let angle=0,spinning=false,history=[],usedNumbers=new Set(),audioCtx=null,tickTimer=null;
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');
const colors=['#6c5ce7','#00b894','#ff7675','#0984e3','#fdcb6e','#e17055','#00cec9','#a29bfe','#fd79a8','#55efc4','#74b9ff','#ffeaa7','#fab1a0','#81ecec','#dfe6e9','#636e72'];

function initAudio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}
function playTick(){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=760;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.045,audioCtx.currentTime+.005);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.045);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.05)}
function playSelectedSound(){if(!audioCtx)return;const now=audioCtx.currentTime;[880,1320].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=now+i*.09;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.30);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.32)})}
function startWheelSound(){stopWheelSound();let interval=65;function tick(){playTick();interval=Math.min(interval+4,145);tickTimer=setTimeout(tick,interval)}tick()}
function stopWheelSound(){if(tickTimer){clearTimeout(tickTimer);tickTimer=null}}

function drawWheel(){
 const cx=350,cy=350,r=320;ctx.clearRect(0,0,700,700);ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);const slice=2*Math.PI/N;
 for(let i=0;i<N;i++){const s=i*slice-Math.PI/2,e=s+slice;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,s,e);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();ctx.save();ctx.rotate(s+slice/2);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=(i%5===4)?'#3b351f':'#fff';ctx.font='900 34px Segoe UI,Arial';ctx.fillText(String(i+1),r*.72,0);ctx.restore()}
 ctx.beginPath();ctx.arc(0,0,58,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=7;ctx.strokeStyle='#17203b';ctx.stroke();ctx.fillStyle='#17203b';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 22px Segoe UI,Arial';ctx.fillText('CMDB',0,-10);ctx.font='800 16px Segoe UI,Arial';ctx.fillText('CSDM',0,16);ctx.restore()
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function showQuestion(idx){const x=DATA[idx],r=document.getElementById('result');r.className='result';r.innerHTML='<div><span class="number">'+(idx+1)+'</span><span class="topic">Questão '+(idx+1)+' de '+N+'</span></div><div class="question">'+escapeHtml(x.q)+'</div><div class="answer"><div class="answer-title">✅ RESPOSTA</div><div>'+escapeHtml(x.a)+'</div></div><div class="tip">💡 <b>Como estudar:</b> tente explicar em voz alta por que essa resposta faz sentido antes de passar para a próxima rodada.</div>';history.unshift(idx+1);history=history.slice(0,10);document.getElementById('history').innerHTML=history.map(x=>'<span class="chip">Questão '+x+'</span>').join('')}
function updateRoundStatus(){document.getElementById('counter').textContent='Rodada: '+usedNumbers.size+'/'+N+' questões sorteadas • '+(N-usedNumbers.size)+' restantes'}
function getUnusedIndex(){const a=[];for(let i=0;i<N;i++)if(!usedNumbers.has(i))a.push(i);return a.length?a[Math.floor(Math.random()*a.length)]:-1}

function spin(){
 if(spinning)return;
 if(usedNumbers.size>=N){alert('🎉 Você completou todas as '+N+' questões! Clique em "Nova rodada" para começar novamente.');return}
 initAudio();spinning=true;document.getElementById('spin').disabled=true;startWheelSound();
 const idx=getUnusedIndex(),slice=2*Math.PI/N,center=idx*slice+slice/2,current=((angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI),targetBase=(-center-current+2*Math.PI)%(2*Math.PI),turns=6+Math.floor(Math.random()*3),start=angle,target=start+turns*2*Math.PI+targetBase,duration=4300,t0=performance.now();
 function frame(now){const t=Math.min(1,(now-t0)/duration);angle=start+(target-start)*(1-Math.pow(1-t,4));drawWheel();if(t<1)requestAnimationFrame(frame);else{angle=target;drawWheel();stopWheelSound();playSelectedSound();usedNumbers.add(idx);spinning=false;document.getElementById('spin').disabled=usedNumbers.size>=N;showQuestion(idx);updateRoundStatus()}}
 requestAnimationFrame(frame)
}
function randomDirect(){if(spinning)return;if(usedNumbers.size>=N){alert('🎉 Você completou todas as '+N+' questões! Clique em "Nova rodada" para começar novamente.');return}initAudio();const idx=getUnusedIndex(),slice=2*Math.PI/N;angle=-(idx*slice+slice/2);drawWheel();playSelectedSound();usedNumbers.add(idx);showQuestion(idx);updateRoundStatus()}
function resetWheel(){if(spinning)return;angle=0;history=[];usedNumbers.clear();drawWheel();document.getElementById('history').innerHTML='';document.getElementById('result').className='result empty';document.getElementById('result').innerHTML='<div><div style="font-size:55px">🎓</div><h2>Nova rodada pronta!</h2><p>Os '+N+' números estão disponíveis novamente.<br>Clique em <b>GIRAR A ROLETA!</b>.</p></div>';document.getElementById('spin').disabled=false;updateRoundStatus()}
document.getElementById('counter').textContent=N+' questões carregadas da sua planilha';updateRoundStatus();drawWheel();
</script>
</body></html>
